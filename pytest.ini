[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = . backend

markers =
    unit: Pure unit tests, no external services
    integration: Tests against running services (requires docker-compose up)
    adversarial: Attack scenario tests
    load: Load and performance tests
    slow: Tests that take more than 5 seconds
